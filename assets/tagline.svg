<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" role="img" aria-label="Zwischenzugs before Zugzwangs. — SunTzv">
  <style>
    .t { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 54px; fill: #e6edf3; letter-spacing: 1px; }
    .s { font-family: Georgia, 'Times New Roman', serif; font-size: 18px; fill: #8b949e; letter-spacing: 5px; }
    @media (prefers-color-scheme: light) {
      .t { fill: #1f2328; }
      .s { fill: #57606a; }
    }
  </style>

  <text class="t" x="450" y="80" text-anchor="middle">Zwischenzugs before Zugzwangs.</text>
